<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular Luxury Plum Gradient Background -->
  <defs>
    <linearGradient id="craftoria-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2E5D" />
      <stop offset="50%" stop-color="#673982" />
      <stop offset="100%" stop-color="#361E44" />
    </linearGradient>
    <linearGradient id="craftoria-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F3" />
      <stop offset="50%" stop-color="#E5D1EC" />
      <stop offset="100%" stop-color="#C8A2C8" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#craftoria-bg)" stroke="#C8A2C8" stroke-width="2" />
  <circle cx="50" cy="50" r="44" stroke="rgba(200, 162, 200, 0.3)" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Center Artisan Sparkle Star / Flower Symbol -->
  <g filter="url(#soft-glow)" fill="url(#craftoria-gold)">
    <!-- 4-point Main Sparkle -->
    <path d="M 50,22 Q 50,42 30,50 Q 50,58 50,78 Q 50,58 70,50 Q 50,42 50,22 Z" />
    <!-- Secondary Diagonal Sparkle Points -->
    <path d="M 50,33 Q 50,45 38,50 Q 50,55 50,67 Q 50,55 62,50 Q 50,45 50,33 Z" transform="rotate(45 50 50)" opacity="0.85" />
    <!-- Center Core Glow -->
    <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
  </g>

  <!-- Accent Sparkle Dots -->
  <circle cx="28" cy="30" r="2" fill="#E5D1EC" opacity="0.8" />
  <circle cx="72" cy="70" r="2.5" fill="#E5D1EC" opacity="0.8" />
  <circle cx="74" cy="32" r="1.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="26" cy="68" r="1.8" fill="#FFFFFF" opacity="0.9" />
</svg>